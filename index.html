<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamdaam — Low Prices. Every Day.</title>
<meta name="description" content="Kamdaam — Low Prices. Every Day. Fashion, mobile accessories, home & kitchen at the right price.">
<link rel="icon" href="../branding/icon-512.png">
<link rel="stylesheet" href="css/styles.css">

      n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
    };
    if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
    t = b.createElement(e); t.async = !0; t.src = v;
    s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);

<!-- PASTE YOUR GOOGLE ANALYTICS MEASUREMENT ID WHERE INDICATED -->
<script>
(function () {
  var GA_MEASUREMENT_ID = 'G-XXXXXXXXXX'; /* PASTE YOUR GOOGLE ANALYTICS MEASUREMENT ID WHERE INDICATED */
  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID === 'G-XXXXXXXXXX') return; /* inert until you paste your ID */

</script>
</head>
<body>
<div id="header"></div>

<!-- Category strip -->
<div class="cat-strip"><div class="cat-row" id="catRow"></div></div>

<main class="wrap">
  <!-- Hero: Diwali Dhamaka Sale -->
  <div class="hero" role="region" aria-label="Diwali Dhamaka Sale">
    <div class="hero-main">
      <div class="hero-text">
        <h2><span class="hero-diwali">DIWALI</span><br>DHAMAKA SALE</h2>
        <p class="hero-sub">Up to 80% Off &#8226; Top Brands</p>
        <a class="hero-cta" href="#dealSection">SHOP NOW</a>
      </div>
      <div class="hero-photo">
        <span class="hero-ribbon">MIN. 50% OFF</span>
        <img src="images/prod-19-led-table-lamp.jpg" alt="LED Table Lamp on sale">
      </div>
    </div>
    <img class="deco hero-d1" src="img/diya.png" alt="" aria-hidden="true">
    <img class="deco hero-d2" src="img/diya.png" alt="" aria-hidden="true">
    <img class="deco hero-s1" src="img/sparkle.png" alt="" aria-hidden="true">
    <img class="deco hero-s2" src="img/sparkle.png" alt="" aria-hidden="true">
    <div class="countdown" aria-label="Sale countdown">
      <span class="cd-label">SALE ENDS IN</span>
      <div class="cd-box"><span class="num" id="cdH">00</span><span class="unit">Hrs</span></div>
      <div class="cd-box"><span class="num" id="cdM">00</span><span class="unit">Min</span></div>
      <div class="cd-box"><span class="num" id="cdS">00</span><span class="unit">Sec</span></div>
      <img class="cd-diya" src="img/diya.png" alt="" aria-hidden="true">
    </div>
  </div>

  <!-- Coupon slide -->
  <div class="coupon-strip" role="note" aria-label="Coupon offer">
    <span>EXTRA 10% OFF* on Prepaid Orders</span>
    <span class="coupon-code">CODE: KAMDAAM10</span>
    <img class="sparkle" src="img/sparkle.png" alt="" aria-hidden="true">
  </div>

  <!-- Search results (hidden until typing) -->
  <section class="section" id="searchSection" style="display:none">
    <div class="section-card">
      <div class="section-head"><h2>Search Results</h2><span class="see-all" id="searchMeta"></span></div>
      <div class="grid" id="searchGrid"></div>
    </div>
  </section>

  <!-- Deals of the Day -->
  <section class="section" id="dealSection">
    <div class="section-card">
      <div class="section-head"><h2>Deals of the Day</h2><a class="chev" href="#" aria-label="View all deals">›</a></div>
      <div class="grid" id="dealGrid"></div>
    </div>
  </section>

  <!-- Bestsellers -->
  <section class="section">
    <div class="section-card">
      <div class="section-head"><h2>Bestsellers</h2><a class="chev" href="#" aria-label="View all bestsellers">›</a></div>
      <div class="grid" id="bestGrid"></div>
    </div>
  </section>

  <div class="note-strip">COD and UPI available. Online payment coming soon.</div>
</main>

<div id="footer"></div>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var KD = window.KD, C = KD.C;
  document.getElementById('header').innerHTML = KD.headerHTML();
  document.getElementById('footer').innerHTML = KD.footerHTML();
  KD.updateBadge();

  /* Category strip: festive squircle tiles */
  var TILE = { fashion: 'img/tile-fashion.png', mobile: 'img/tile-mobile.png',
    electronics: 'img/tile-electronics.png', home: 'img/tile-home.png',
    appliances: 'img/tile-appliances.png', grocery: 'img/tile-grocery.png' };
  var SHORT = { fashion: 'Fashion', mobile: 'Mobiles', electronics: 'Electronics',
    home: 'Home', appliances: 'Appliances', grocery: 'Grocery' };
  document.getElementById('catRow').innerHTML = C.categories.map(function (c) {
    var t = TILE[c.id] || KD.bannerFile(c.banner);
    var label = SHORT[c.id] || c.name;
    return '<a class="cat-item" href="category.html?id=' + c.id + '">' +
      '<img src="' + t + '" alt="' + KD.esc(label) + '" loading="lazy">' +
      '<span>' + KD.esc(label) + '</span></a>';
  }).join('');
  KD.startCountdown();

  /* Deals of the Day: discount-sorted */
  var deals = C.products.slice().sort(function (a, b) { return b.discount_pct - a.discount_pct; }).slice(0, 10);
  document.getElementById('dealGrid').innerHTML = deals.map(function (p, i) { return KD.cardHTML(p, i); }).join('');

  /* Bestsellers */
  var best = C.products.filter(function (p) { return p.badge === 'bestseller'; });
  document.getElementById('bestGrid').innerHTML = best.map(function (p, i) { return KD.cardHTML(p, i); }).join('');

  /* Search */
  var input = document.getElementById('search');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    var show = q.length > 0;
    document.getElementById('searchSection').style.display = show ? '' : 'none';
    document.getElementById('dealSection').style.display = show ? 'none' : '';
    if (!show) return;
    var res = C.products.filter(function (p) {
      return (p.name + ' ' + p.name_en + ' ' + p.description).toLowerCase().indexOf(q) > -1;
    });
    document.getElementById('searchMeta').textContent = res.length + ' results';
    document.getElementById('searchGrid').innerHTML = res.length
      ? res.map(function (p, i) { return KD.cardHTML(p, i); }).join('')
      : '<div class="empty"><div class="art">🔍</div><h3>No results found</h3><p>Try searching for something else</p></div>';
  });
})();
</script>
</body>
</html>
