<link rel="stylesheet" href="css/styles.css?v=2.5">

<script>

  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID === 'G-XXXXXXXXXX') return; /* inert until you paste your ID */

</head>
<body>
<div id="header"></div>
<main class="wrap">
  <a class="back" href="index.html">‹ Home</a>
  <div id="catHead"></div>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</main>
<div id="footer"></div>

<script src="js/catalog.js?v=2.6"></script>
<script src="js/app.js?v=2.6"></script>
<script>
(function () {
  var KD = window.KD;
  var id = new URLSearchParams(location.search).get('id');
  var c = KD.catById(id) || KD.C.categories[0];
  document.getElementById('title').textContent = c.name + ' — Kamdaam';
  document.getElementById('header').innerHTML = KD.headerHTML();
  document.getElementById('footer').innerHTML = KD.footerHTML();
  KD.updateBadge();
  document.getElementById('catHead').innerHTML =
    '<img class="cat-banner" src="banners/banner-' + c.id + '.png" alt="' + KD.esc(c.name) + '">' +
    '<h1 class="page-title">' + KD.esc(c.name) + '</h1>' +
    '<p class="page-sub">' + KD.esc(c.tagline) + '</p>';
  var items = KD.C.products.filter(function (p) { return p.category === c.id; });
  if (items.length === 0) {
    /* v2.3 festive Coming Soon for empty categories (Electronics, Appliances, Grocery) */
    document.getElementById('grid').innerHTML =
      '<div class="coming-soon">' +
      '<img src="img/diya.png" alt="Diya">' +
      '<h2>Coming Soon</h2>' +
      '<div class="cs-cat">' + KD.esc(c.name) + '</div>' +
      '<p class="cs-hinglish">Jald Aa Raha Hai!</p>' +
      '<p class="cs-sub">We are stocking up the best products for you.</p>' +
      '<a class="cs-btn" href="index.html">Back to Home</a>' +
      '</div>';
  } else {
    document.getElementById('grid').innerHTML = items.map(function (p, i) { return KD.cardHTML(p, i); }).join('');
  }
})();
</script>
</body>
</html>
