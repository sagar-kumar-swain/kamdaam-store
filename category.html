<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title">Kamdaam</title>
<link rel="icon" href="../branding/icon-512.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="header"></div>
<main class="wrap">
  <a class="back" href="index.html">‹ Home</a>
  <div id="catHead"></div>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</main>
<div id="footer"></div>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var KD = window.KD;
  var id = new URLSearchParams(location.search).get('id');
  var c = KD.catById(id) || KD.C.categories[0];
  document.getElementById('title').textContent = c.name + ' — Kamdaam';
  document.getElementById('header').innerHTML = KD.headerHTML();
  document.getElementById('footer').innerHTML = KD.footerHTML();
  KD.updateBadge();
  document.getElementById('catHead').innerHTML =
    '<img class="cat-banner" src="' + KD.bannerFile(c.banner) + '" alt="' + KD.esc(c.name) + '">' +
    '<h1 class="page-title">' + KD.esc(c.name) + '</h1>' +
    '<p class="page-sub">' + KD.esc(c.tagline) + '</p>';
  var items = KD.C.products.filter(function (p) { return p.category === c.id; });
  document.getElementById('grid').innerHTML = items.map(KD.cardHTML).join('');
})();
</script>
</body>
</html>
