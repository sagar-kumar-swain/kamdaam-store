<link rel="stylesheet" href="css/styles.css">

<body>
<div id="header"></div>
<main class="wrap">
  <a class="back" href="index.html">‹ Home</a>
  <h1 class="page-title">Your Cart</h1>
  <div id="cartBody"></div>
</main>
<div id="footer"></div>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var KD = window.KD;
  document.getElementById('header').innerHTML = KD.headerHTML();
  document.getElementById('footer').innerHTML = KD.footerHTML();

  /* coupon + payment state */
  var promo = { code: '', applied: false, ok: false, msg: '' };
  var payMethod = 'cod'; /* 'cod' | 'upi' */

  function items() {
    var c = KD.getCart(), out = [];
    Object.keys(c).forEach(function (id) {
      var p = KD.prodById(id);
      if (p && c[id] > 0) out.push({ p: p, q: c[id] });
    });
    return out;
  }
  function totals(list) {
    var sub = 0, mrp = 0;
    list.forEach(function (it) { sub += it.p.price * it.q; mrp += it.p.mrp * it.q; });
    /* KAMDAAM10: exactly 10% off, only when payment is prepaid (UPI) */
    var coupon = (promo.applied && payMethod === 'upi') ? Math.floor(sub * 0.10) : 0; /* floor — matches Android app exactly */
    return { sub: sub, mrp: mrp, savings: mrp - sub, coupon: coupon, total: sub - coupon };
  }
  function payLabel() {
    return payMethod === 'upi' ? 'UPI (prepaid)' : 'Cash on Delivery';
  }
  function promoHTML() {
    var msg = '';
    if (promo.msg) msg = '<div class="' + (promo.ok ? 'promo-ok' : 'promo-err') + '">' + KD.esc(promo.msg) + '</div>';
    return '<div class="promo"><div class="promo-row">' +
      '<input id="promoInput" type="text" placeholder="Enter promo code" maxlength="20" value="' + KD.esc(promo.code) + '" aria-label="Promo code">' +
      '<button class="btn btn-primary" id="promoApply" type="button">Apply</button></div>' +
      msg +
      '<div class="promo-note">*KAMDAAM10 gives 10% off on prepaid (UPI) orders.</div></div>';
  }
  function payHTML() {
    return '<div class="pay-methods" role="radiogroup" aria-label="Payment method">' +
      '<div class="pm-title">Payment Method</div>' +
      '<label class="pm-option"><input type="radio" name="pay" value="cod"' + (payMethod === 'cod' ? ' checked' : '') + '> Cash on Delivery <span class="pm-sub">Pay when you receive</span></label>' +
      '<label class="pm-option"><input type="radio" name="pay" value="upi"' + (payMethod === 'upi' ? ' checked' : '') + '> UPI <span class="pm-sub">Prepaid — pay now</span></label>' +
      '<label class="pm-option disabled"><input type="radio" name="pay" value="online" disabled> Online Payment <span class="soon-badge">Coming Soon</span></label>' +
      '</div>';
  }
  /* v2.5: in-app address form — no WhatsApp needed for COD orders */
  function addrHTML() {
    return '<div class="addr-form"><div class="pm-title">Delivery Details</div>' +
      '<input id="adName" class="addr-in" placeholder="Full Name *" maxlength="60" autocomplete="name">' +
      '<input id="adPhone" class="addr-in" placeholder="Mobile Number * (10 digits)" maxlength="10" inputmode="numeric" autocomplete="tel">' +
      '<input id="adAddr" class="addr-in" placeholder="Street Address * (house no, street, area)" maxlength="120" autocomplete="street-address">' +
      '<div class="addr-row"><input id="adCity" class="addr-in" placeholder="City *" maxlength="40">' +
      '<input id="adPin" class="addr-in" placeholder="Pincode * (6 digits)" maxlength="6" inputmode="numeric"></div>' +
      '<input id="adState" class="addr-in" placeholder="State *" maxlength="40">' +
      '<div id="addrErr" class="promo-err" style="display:none"></div></div>';
  }
  function readAddr() {
    return {
      name: document.getElementById('adName').value.trim(),
      phone: document.getElementById('adPhone').value.replace(/\D/g, '').slice(-10),
      address: document.getElementById('adAddr').value.trim(),
      city: document.getElementById('adCity').value.trim(),
      state: document.getElementById('adState').value.trim(),
      pin: document.getElementById('adPin').value.replace(/\D/g, '')
    };
  }
  function validateAddr(a) {
    if (!a.name) return 'Please enter your full name';
    if (!/^\d{10}$/.test(a.phone)) return 'Please enter a valid 10-digit mobile number';
    if (!a.address) return 'Please enter your street address';
    if (!a.city) return 'Please enter your city';
    if (!a.state) return 'Please enter your state';
    if (!/^\d{6}$/.test(a.pin)) return 'Please enter a valid 6-digit pincode';
    if (/[\u0900-\u097F]/.test(a.name + ' ' + a.address + ' ' + a.city + ' ' + a.state))
      return 'Please write the address in English';
    return null;
  }
  function showAddrErr(msg) {
    var e = document.getElementById('addrErr');
    e.textContent = msg; e.style.display = msg ? '' : 'none';
  }
  /* v2.5: automatic dispatch to the fulfillment worker (COD only) */
  var WORKER_URL = 'https://kamdaam-fulfill.dipurajwansi2.workers.dev';
  var WORKER_KEY = 'cf197de3d83f2670fc9af7199ee82398f3646f96566faa3b';
  var lastOrder = null; /* snapshot for retry */
  function placeAutoOrder() {
    var a = readAddr();
    var err = validateAddr(a);
    showAddrErr(err || '');
    if (err) return;
    var list = items();
    if (!list.length) { showAddrErr('Your cart is empty'); return; }
    var t = totals(list);
    var btn = document.getElementById('placeAuto');
    btn.disabled = true; btn.textContent = 'Placing Order...';
    var orderId = 'KD' + Date.now();
    var payload = {
      order_id: orderId,
      items: list.map(function (it) { return { sku: it.p.id, qty: it.q, price: it.p.price }; }),
      customer: { first_name: a.name, address1: a.address, phone: a.phone, city: a.city, zip: a.pin, province: a.state },
      payment_method: 'cod',
      total: t.total
    };
    lastOrder = { payload: payload, total: t.total };
    fetch(WORKER_URL + '/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Kamdaam-Key': WORKER_KEY },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json().then(function (j) { return { code: r.status, body: j }; }); })
    .then(function (res) {
      if (res.code >= 200 && res.code < 300 && res.body.ok) {
        KD.setCart({});
        document.getElementById('cartBody').innerHTML =
          '<div class="empty"><div class="art">✅</div><h3>Order Placed!</h3>' +
          '<p>Order ID: ' + KD.esc(orderId) + '<br>Your order is on its way to our printing partner.</p>' +
          '<a class="btn btn-primary" href="index.html">Continue Shopping</a></div>';
      } else {
        var e = (res.body && res.body.error) || 'network error';
        showAddrErr('Automatic dispatch failed (' + e + '). Your cart is saved — try again or use WhatsApp below.');
        btn.disabled = false; btn.textContent = 'Try Again';
      }
    }).catch(function () {
      showAddrErr('Network error. Check your connection and try again, or use WhatsApp below.');
      btn.disabled = false; btn.textContent = 'Try Again';
    });
  }
  function render() {
    var list = items(), box = document.getElementById('cartBody');
    if (!list.length) {
      box.innerHTML = '<div class="empty"><div class="art">🛒</div>' +
        '<h3>Your cart is empty</h3><p>Add something you like to get started</p>' +
        '<a class="btn btn-primary" href="index.html">Start Shopping</a></div>';
      return;
    }
    var t = totals(list);
    var couponRow = t.coupon
      ? '<div class="tr"><span>Coupon (KAMDAAM10)</span><span style="color:var(--offer-green)">− ' + KD.money(t.coupon) + '</span></div>'
      : '';
    box.innerHTML =
      '<div class="cart-list">' + list.map(function (it) {
        return '<div class="cart-row"><img src="' + KD.imgFile(it.p) + '" alt="' + KD.esc(it.p.name) + '">' +
          '<div class="info"><div class="nm">' + KD.esc(it.p.name) + '</div>' +
          '<div class="up">' + KD.money(it.p.price) + ' per piece</div>' +
          '<div class="row-foot">' + KD.stepperHTML(it.p.id, it.q) +
          '<span class="lt">' + KD.money(it.p.price * it.q) + '</span></div>' +
          '<button class="rm" data-remove="' + it.p.id + '">Remove</button></div></div>';
      }).join('') + '</div>' +
      promoHTML() + payHTML() +
      '<div class="totals">' +
      '<div class="tr"><span>Total MRP</span><span>' + KD.money(t.mrp) + '</span></div>' +
      '<div class="tr"><span>Discount</span><span style="color:var(--offer-green)">− ' + KD.money(t.savings) + '</span></div>' +
      couponRow +
      '<div class="tr"><span>Delivery</span><span style="color:var(--offer-green)">FREE</span></div>' +
      '<div class="tr grand"><span>Total</span><span>' + KD.money(t.total) + '</span></div>' +
      '<div class="save-line">You save: ' + KD.money(t.savings + t.coupon) + '</div></div>' +
      addrHTML() +
      (payMethod === 'cod'
        ? '<button class="btn btn-primary btn-block" id="placeAuto" type="button" style="margin-bottom:12px">Place Order (' + KD.money(t.total) + ')</button>' +
          '<a class="btn btn-wa btn-block" id="checkoutWa" target="_blank" rel="noopener" style="margin-bottom:24px">Or Order on WhatsApp</a>' +
          '<p class="promo-note" style="text-align:center">No WhatsApp needed — your order goes straight to our printing partner.</p>'
        : '<a class="btn btn-wa btn-block" id="checkoutWa" target="_blank" rel="noopener" style="margin-bottom:24px">' +
          'Order on WhatsApp (' + KD.money(t.total) + ')</a>');

    document.getElementById('checkoutWa').href = KD.waLink(KD.cartOrderText(list, t, payLabel()));
    var autoBtn = document.getElementById('placeAuto');
    if (autoBtn) autoBtn.addEventListener('click', placeAutoOrder);
    box.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = KD.getCart(); delete c[b.getAttribute('data-remove')]; KD.setCart(c); render();
      });
    });
    var applyBtn = document.getElementById('promoApply');
    if (applyBtn) applyBtn.addEventListener('click', function () {
      var v = document.getElementById('promoInput').value.trim().toUpperCase();
      promo.code = v;
      if (v === 'KAMDAAM10') {
        promo.applied = true; promo.ok = true;
        promo.msg = payMethod === 'upi'
          ? 'Code applied: 10% off on your prepaid (UPI) order.'
          : 'Code applied: 10% off — select UPI (prepaid) below to get it.';
      } else {
        promo.applied = false; promo.ok = false;
        promo.msg = 'Invalid promo code. Please check and try again.';
      }
      render();
    });
    box.querySelectorAll('input[name="pay"]').forEach(function (r) {
      r.addEventListener('change', function () { payMethod = r.value; render(); });
    });
  }
  window.onCartChange = render;
  render();
  KD.updateBadge();
})();
</script>
</body>
</html>
