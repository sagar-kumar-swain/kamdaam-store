<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title">Kamdaam</title>
<link rel="icon" href="../branding/icon-512.png">
<link rel="stylesheet" href="css/styles.css?v=2.5">

    if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
    t = b.createElement(e); t.async = !0; t.src = v;

  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID === 'G-XXXXXXXXXX') return; /* inert until you paste your ID */

</head>
<body>
<div id="header"></div>
<main class="wrap">
  <a class="back" href="index.html">‹ Home</a>
  <div class="pdp" id="pdp"></div>

  <!-- Related products -->
  <section class="section">
    <div class="section-card">
      <div class="section-head"><h2>You May Also Like</h2></div>
      <div class="grid" id="relGrid"></div>
    </div>
  </section>
</main>
<div id="footer"></div>

<script src="js/catalog.js?v=2.5"></script>
<script src="js/app.js?v=2.5"></script>
<script>
(function () {
  var KD = window.KD;
  var id = new URLSearchParams(location.search).get('id');
  var p = KD.prodById(id) || KD.C.products[0];
  document.getElementById('title').textContent = p.name + ' — Kamdaam';
  document.getElementById('header').innerHTML = KD.headerHTML();
  document.getElementById('footer').innerHTML = KD.footerHTML();
  KD.updateBadge();

  var savings = p.mrp - p.price;
  var stock = p.stock > 20
    ? '<span>In Stock</span>'
    : '<span>Only ' + p.stock + ' left</span>';
  var badge = p.badge === 'bestseller' ? '<span class="badge best">BESTSELLER</span>' : '';

  /* Gallery: Flipkart-style multi-view with thumbnails */
  var gal = (p.gallery && p.gallery.length) ? p.gallery : [p.image];
  var thumbs = gal.map(function (g, i) {
    return '<img class="pdp-thumb' + (i === 0 ? ' sel' : '') + '" data-gi="' + i +
      '" src="' + g + '" alt="View ' + (i + 1) + '" loading="lazy">';
  }).join('');

  document.getElementById('pdp').innerHTML =
    '<div class="pdp-img"><img id="pdpMain" src="' + gal[0] + '" alt="' + KD.esc(p.name) + '">' + badge +
    (gal.length > 1 ? '<div class="pdp-thumbs">' + thumbs + '</div>' : '') + '</div>' +
    '<div class="pdp-info"><h1>' + KD.esc(p.name) + '</h1>' +
    KD.ratingHTML(p) +
    '<div class="pdp-price">' + KD.priceHTML(p) + '</div>' +
    '<div class="savings">You save: ' + KD.money(savings) + ' (' + p.discount_pct + '%)</div>' +
    '<div class="tax-note">Inclusive of all taxes</div>' +
    '<ul class="highlights">' + p.highlights.map(function (h) { return '<li>' + KD.esc(h) + '</li>'; }).join('') + '</ul>' +
    '<p class="desc">' + KD.esc(p.description) + '</p>' +
    '<div class="qty-row"><span class="lbl">Quantity:</span><span data-pdp-stepper>' +
    KD.stepperHTML(p.id, KD.getCart()[p.id] || 1) + '</span></div>' +
    '<div class="cta-stack">' +
    '<button class="btn btn-primary btn-block" id="addBtn">ADD TO CART</button>' +
    '<a class="btn btn-wa" id="waBtn" target="_blank" rel="noopener">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.8.3.2.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.4 0 .1 0 .7-.2 1.3z"/></svg>' +
    'Order on WhatsApp</a></div>' +
    '<div class="trust"><span>COD Available</span><span>UPI Available</span>' + stock + '</div></div>';

  function qty() { return KD.getCart()[p.id] || 1; }
  function refreshWa() {
    document.getElementById('waBtn').href = KD.waLink(KD.singleOrderText(p, qty()));
  }
  refreshWa();
  window.onCartChange = refreshWa;

  /* Gallery thumbnail switching */
  var pdpMain = document.getElementById('pdpMain');
  Array.prototype.forEach.call(document.querySelectorAll('.pdp-thumb'), function (t) {
    t.addEventListener('click', function () {
      pdpMain.src = gal[parseInt(t.getAttribute('data-gi'), 10)];
      Array.prototype.forEach.call(document.querySelectorAll('.pdp-thumb'), function (x) { x.classList.remove('sel'); });
      t.classList.add('sel');
    });
  });

  /* Related products: same category, pastel-rotated cards */
  var rel = KD.C.products.filter(function (x) { return x.category === p.category && x.id !== p.id; }).slice(0, 5);
  document.getElementById('relGrid').innerHTML = rel.map(function (x, i) { return KD.cardHTML(x, i); }).join('');
  document.getElementById('addBtn').addEventListener('click', function () {
    var c = KD.getCart(); c[p.id] = qty(); KD.setCart(c); location.href = 'cart.html';
  });
})();
</script>
</body>
</html>
